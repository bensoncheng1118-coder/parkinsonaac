<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>抗抖動 AAC 輔助溝通系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg-color: #f8fafc;
            --text-main: #1e293b;
        }
        body { font-family: sans-serif; background-color: var(--bg-color); }
        
        /* 針對帕金森氏症優化的大按鈕 */
        .aac-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-weight: 800;
            border-radius: 20px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            transition: transform 0.1s, background-color 0.2s;
            cursor: pointer;
            border: 4px solid transparent;
            min-height: 140px; /* 超大點擊區域 */
        }

        .aac-btn:active {
            transform: scale(0.92);
            border-color: #000;
        }

        /* 導覽列按鈕 */
        .nav-btn {
            height: 120px;
            font-size: 2rem;
            color: white;
        }

        /* 句子顯示列 */
        #display-area {
            font-size: 3rem;
            line-height: 1.2;
            min-height: 120px;
            border: 6px solid #3b82f6;
            background: white;
        }

        /* 防止文字選取干擾操作 */
        * { user-select: none; }
    </style>
</head>
<body class="h-screen flex flex-col p-6">

    <!-- 上方：句子顯示列 -->
    <div class="relative mb-6">
        <div id="display-area" class="w-full p-4 rounded-3xl shadow-inner overflow-y-auto flex items-center">
            <span id="output-text" class="text-blue-700 font-bold"></span>
        </div>
        <button onclick="clearText()" class="absolute right-4 top-1/2 -translate-y-1/2 bg-red-500 text-white px-8 py-4 rounded-2xl text-2xl font-bold active:bg-red-700">
            清除
        </button>
    </div>

    <!-- 中間：常用語區域 (Grid 佈局，按鈕間距加大) -->
    <div id="phrases-grid" class="flex-grow grid grid-cols-2 gap-8 overflow-y-auto mb-6">
        <!-- 由 JavaScript 動態生成 -->
    </div>

    <!-- 下方：分類導覽列 (食衣住行) -->
    <div class="grid grid-cols-4 gap-6">
        <button onclick="changeCategory('eat')" class="nav-btn bg-orange-500 rounded-3xl shadow-lg active:bg-orange-700">食</button>
        <button onclick="changeCategory('cloth')" class="nav-btn bg-blue-500 rounded-3xl shadow-lg active:bg-blue-700">衣</button>
        <button onclick="changeCategory('live')" class="nav-btn bg-green-500 rounded-3xl shadow-lg active:bg-green-700">住</button>
        <button onclick="changeCategory('move')" class="nav-btn bg-purple-500 rounded-3xl shadow-lg active:bg-purple-700">行</button>
    </div>

    <script>
        const categories = {
            'common': ['你好', '謝謝', '請幫我', '我想休息', '對不起'],
            'eat': ['喝水', '肚子餓', '想吃藥', '太燙了', '吃飽了', '想吃稀飯'],
            'cloth': ['太冷了', '太熱了', '換衣服', '穿外套', '尿布濕了'],
            'live': ['想睡覺', '開電視', '關燈', '請幫我翻身', '回房間'],
            'move': ['去廁所', '坐輪椅', '去散步', '慢一點', '回家']
        };

        let lastClickTime = 0;
        const coolDown = 500; // 防抖動時間：500毫秒

        function changeCategory(cat) {
            const grid = document.getElementById('phrases-grid');
            grid.innerHTML = ''; // 清空舊按鈕

            categories[cat].forEach(text => {
                const btn = document.createElement('div');
                btn.className = 'aac-btn bg-white text-slate-800';
                btn.innerText = text;
                btn.onclick = () => addText(text);
                grid.appendChild(btn);
            });
        }

        function addText(text) {
            const now = Date.now();
            if (now - lastClickTime < coolDown) return; // 忽略連點
            lastClickTime = now;

            const output = document.getElementById('output-text');
            output.innerText += text + " ";
            
            // 語音反饋 (TTS)
            const synth = window.speechSynthesis;
            const utter = new SpeechSynthesisUtterance(text);
            utter.lang = 'zh-TW';
            synth.speak(utter);

            // 傳送到後端紀錄 (選配)
            saveLog(text);
        }

        function clearText() {
            document.getElementById('output-text').innerText = '';
        }

        // 非同步上傳至後端
        async function saveLog(msg) {
            try {
                await fetch('http://localhost:5000/api/log', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ message: msg, timestamp: new Date() })
                });
            } catch (e) { console.log('後端未啟動或連線失敗'); }
        }

        // 初始化
        window.onload = () => changeCategory('common');
    </script>
</body>
</html>
