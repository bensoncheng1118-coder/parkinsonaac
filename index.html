<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>帕金森氏症專用 AAC 多功能控制系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,700,0,0" />

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    <style>
        .phrase-btn,
        .nav-btn,
        .ctrl-btn {
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        /* 調整中間按鈕：移除正方形限制，使其呈現大又寬的長方形並充滿網格 */
        .phrase-btn {
            width: 100%;
            height: 100%;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 28px;
            background-color: white;
            box-shadow: 0 6px 0 #cbd5e1;
            border: 3px solid #e2e8f0;
            transition: all 0.05s;
            gap: 12px;
        }

        .gaze-progress {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0%;
            height: 100%;
            background-color: rgba(34, 197, 94, 0.2);
            transition: width 0.1s linear;
            pointer-events: none;
            z-index: 0;
        }

        .btn-content {
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        .icon-main {
            font-size: 3.5rem !important;
            color: #22c55e;
        }
	.arasaac-icon {
            width: 76px;
            height: 76px;
            object-fit: contain;
            display: block;
        }

        .arasaac-icon-small {
            width: 48px;
            height: 48px;
            object-fit: contain;
            display: block;
        }

        .text-main {
            font-size: 1.6rem;
            font-weight: 900;
            color: #1e293b;
        }

        /* 最下排導覽按鈕維持大尺寸 */
        .nav-btn {
            height: 130px;
            font-size: 2.2rem;
            font-weight: 900;
            color: white;
            border-radius: 24px;
            box-shadow: 0 6px 8px rgba(0, 0, 0, 0.15);
        }

        #display-box {
            min-height: 60px;
            max-height: 60px;
            font-size: 1.6rem;
            background: white;
            border: 3px solid #22c55e;
            border-radius: 16px;
            padding: 5px 15px;
            font-weight: bold;
            color: #15803d;
            display: flex;
            align-items: center;
            overflow-x: auto;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        #head-cursor {
            position: fixed;
            width: 24px;
            height: 24px;
            background-color: rgba(34, 197, 94, 0.8);
            border: 3px solid white;
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            display: none;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
        }

        /* 完全隱藏右下角的視訊畫面，不影響追蹤功能 */
        #webcam-preview {
            position: fixed;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
            z-index: -1;
        }

        #loading-status {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 20px 40px;
            border-radius: 16px;
            font-size: 1.5rem;
            z-index: 10000;
            display: none;
        }

        /* 新增：左側右拉選單動畫與遮罩樣式 */
        #settings-sidebar {
            transition: transform 0.3s ease-in-out;
            z-index: 10050;
        }
        #sidebar-overlay {
            transition: opacity 0.3s ease-in-out;
            z-index: 10040;
        }
    </style>
</head>

<body class="h-screen flex flex-col p-4 bg-slate-100 overflow-hidden text-slate-800">

    <div id="loading-status">AI 模型載入中，請稍候...</div>
    <div id="head-cursor"></div>
    <video id="webcam-preview" autoplay playsinline muted></video>

    <div id="sidebar-overlay" onclick="toggleSettingsMenu()" class="fixed inset-0 bg-black/50 opacity-0 pointer-events-none transition-opacity"></div>
    <div id="settings-sidebar" class="fixed top-0 left-0 h-full w-80 bg-white shadow-2xl p-6 transform -translate-x-full flex flex-col gap-6">
        <div class="flex justify-between items-center border-b pb-3">
            <h2 class="text-xl font-black flex items-center gap-2 text-indigo-900">
                <span class="material-symbols-outlined">settings</span>系統進階設定
            </h2>
            <button onclick="toggleSettingsMenu()" class="text-slate-400 hover:text-slate-600">
                <span class="material-symbols-outlined" style="font-size: 2rem;">close</span>
            </button>
        </div>
        
        <div class="flex flex-col gap-2">
            <label class="font-bold text-slate-700 flex justify-between">
                <span>水平(X軸)靈敏度</span>
                <span id="val-sensX" class="text-indigo-600">6.0</span>
            </label>
            <input type="range" id="input-sensX" min="1" max="50" step="0.5" value="6.0" oninput="updateSettingsFromUI()" class="w-full h-3 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-indigo-600">
        </div>

        <div class="flex flex-col gap-2">
            <label class="font-bold text-slate-700 flex justify-between">
                <span>垂直(Y軸)靈敏度</span>
                <span id="val-sensY" class="text-indigo-600">6.0</span>
            </label>
            <input type="range" id="input-sensY" min="1" max="50" step="0.5" value="6.0" oninput="updateSettingsFromUI()" class="w-full h-3 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-indigo-600">
        </div>

        <div class="flex flex-col gap-2">
            <label class="font-bold text-slate-700 flex justify-between">
                <span>按鈕注視延遲時間</span>
                <span id="val-dwell" class="text-indigo-600">2.2 秒</span>
            </label>
            <input type="range" id="input-dwell" min="0.5" max="5.0" step="0.1" value="2.2" oninput="updateSettingsFromUI()" class="w-full h-3 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-indigo-600">
            <p class="text-xs text-slate-400">提示：帕金森氏症患者若有震顫，建議將時間拉長（如 2.5秒以上）以防誤觸。</p>
        </div>

        <div class="border-t pt-4 mt-2">
            <button onclick="openVocabularyModal()" class="w-full py-3 bg-indigo-600 text-white font-bold rounded-xl shadow-md hover:bg-indigo-700 transition-colors flex items-center justify-center gap-2">
                <span class="material-symbols-outlined">menu_book</span>自訂詞彙介面
            </button>
        </div>

        <div class="mt-auto border-t pt-4">
            <button onclick="toggleSettingsMenu()" class="w-full py-3 bg-slate-800 text-white font-bold rounded-xl shadow-md hover:bg-slate-950 transition-colors">
                完成並儲存
            </button>
        </div>
    </div>

    <div id="vocab-modal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm hidden z-[10100] flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-5xl h-[85vh] rounded-3xl shadow-2xl flex flex-col overflow-hidden">
            <div class="bg-indigo-900 text-white p-6 flex justify-between items-center shrink-0">
                <div>
                    <h3 class="text-2xl font-black flex items-center gap-2">
                        <span class="material-symbols-outlined text-3xl">menu_book</span> 詞彙庫
                    </h3>
                    <p class="text-indigo-200 text-sm mt-1">請為各類別分別挑選【剛好 9 個】核心詞彙放置於主介面上。</p>
                </div>
                <button onclick="closeVocabularyModal()" class="text-white/70 hover:text-white bg-white/10 hover:bg-white/20 p-2 rounded-full transition-colors">
                    <span class="material-symbols-outlined" style="font-size: 2rem;">close</span>
                </button>
            </div>

            <div class="bg-slate-100 p-3 flex gap-2 border-b shrink-0 overflow-x-auto no-scrollbar">
                <button id="tab-v-common" onclick="switchVocabTab('common')" class="px-6 py-2.5 font-black text-lg rounded-xl transition-all bg-indigo-600 text-white shadow-md">常用</button>
                <button id="tab-v-eat" onclick="switchVocabTab('eat')" class="px-6 py-2.5 font-black text-lg rounded-xl transition-all bg-white text-slate-700 hover:bg-slate-200">食</button>
                <button id="tab-v-cloth" onclick="switchVocabTab('cloth')" class="px-6 py-2.5 font-black text-lg rounded-xl transition-all bg-white text-slate-700 hover:bg-slate-200">衣</button>
                <button id="tab-v-live" onclick="switchVocabTab('live')" class="px-6 py-2.5 font-black text-lg rounded-xl transition-all bg-white text-slate-700 hover:bg-slate-200">住</button>
                <button id="tab-v-move" onclick="switchVocabTab('move')" class="px-6 py-2.5 font-black text-lg rounded-xl transition-all bg-white text-slate-700 hover:bg-slate-200">行</button>
            </div>

            <div class="bg-amber-50 border-b border-amber-200 px-6 py-2 flex justify-between items-center shrink-0">
                <span class="text-amber-800 font-bold flex items-center gap-1 text-sm">
                    <span class="material-symbols-outlined text-base">info</span> 點擊方格以勾選或取消，每個分類必須正好選擇 9 個詞彙。
                </span>
                <span id="vocab-counter" class="bg-indigo-100 text-indigo-900 font-black px-4 py-1 rounded-full text-base border border-indigo-300">
                    當前類別已選：0 / 9
                </span>
            </div>

            <div id="vocab-selection-grid" class="flex-grow overflow-y-auto p-6 grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4 bg-slate-50">
                </div>

            <div class="p-4 bg-slate-100 border-t flex justify-end gap-3 shrink-0">
                <button onclick="closeVocabularyModal()" class="px-6 py-3 bg-slate-400 text-white font-black rounded-xl hover:bg-slate-500 transition-colors text-lg">
                    取消變更
                </button>
                <button onclick="saveVocabularySelection()" class="px-8 py-3 bg-green-600 text-white font-black rounded-xl hover:bg-green-700 shadow-md transition-colors text-lg flex items-center gap-2">
                    <span class="material-symbols-outlined">save</span> 確認儲存並套用
                </button>
            </div>
        </div>
    </div>

    <div class="flex gap-3 mb-2">
        <button onclick="toggleSettingsMenu()" id="btn-settings-toggle"
            class="w-20 h-[60px] bg-slate-600 hover:bg-slate-700 text-white font-bold rounded-xl shadow-lg transition-all flex flex-col items-center justify-center">
            <span class="material-symbols-outlined" style="font-size: 1.6rem;">settings</span>
            <span class="text-[10px]">設定</span>
        </button>

        <button onclick="toggleLanguage()" id="btn-lang-toggle"
            class="w-36 h-[60px] bg-slate-700 hover:bg-slate-800 text-white font-bold rounded-xl shadow-lg transition-all flex flex-col items-center justify-center gap-1">
            <span class="material-symbols-outlined" style="font-size: 1.4rem;">translate</span>
            <span class="text-xs" id="current-lang-text">中文(國語)</span>
        </button>

        <select id="btn-mode" onchange="switchControlMode(this.value)"
            class="w-32 h-[60px] bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-bold text-center shadow-lg transition-colors cursor-pointer outline-none px-2">
            <option value="touch" selected>模式：觸控</option>
            <option value="head">模式：頭控</option>
            <option value="eye">模式：眼控</option>
        </select>

        <div id="display-box" class="flex-grow shadow-md no-scrollbar">
            <span id="output"></span>
        </div>

        <button id="btn-play" onclick="playAll()"
            class="ctrl-btn w-24 h-[60px] bg-green-600 text-white rounded-xl font-bold flex flex-col items-center justify-center shadow-lg">
            <div class="gaze-progress"></div>
            <div class="btn-content">
                <span class="material-symbols-outlined" style="font-size: 1.6rem;">play_circle</span>
                <span class="text-xs">播放</span>
            </div>
        </button>

        <button id="btn-clear" onclick="clearAll()"
            class="ctrl-btn w-24 h-[60px] bg-red-500 text-white rounded-xl font-bold flex flex-col items-center justify-center shadow-lg">
            <div class="gaze-progress"></div>
            <div class="btn-content">
                <span class="material-symbols-outlined" style="font-size: 1.6rem;">delete_sweep</span>
                <span class="text-xs">清除</span>
            </div>
        </button>
    </div>

    <div id="grid-container"
        class="flex-grow grid grid-cols-3 grid-rows-3 gap-4 mb-4 p-1 pb-3">
        </div>

    <div class="grid grid-cols-5 gap-3 pb-2">
        <button id="nav-common" onclick="updateGrid('common')" class="nav-btn bg-gray-500">
            <div class="gaze-progress"></div><span class="btn-content">常用</span>
        </button>
        <button id="nav-eat" onclick="updateGrid('eat')" class="nav-btn bg-orange-500">
            <div class="gaze-progress"></div><span class="btn-content">食</span>
        </button>
        <button id="nav-cloth" onclick="updateGrid('cloth')" class="nav-btn bg-blue-500">
            <div class="gaze-progress"></div><span class="btn-content">衣</span>
        </button>
        <button id="nav-live" onclick="updateGrid('live')" class="nav-btn bg-green-500">
            <div class="gaze-progress"></div><span class="btn-content">住</span>
        </button>
        <button id="nav-move" onclick="updateGrid('move')" class="nav-btn bg-purple-500">
            <div class="gaze-progress"></div><span class="btn-content">行</span>
        </button>
    </div>

        // ARASAAC API 圖示串接：只影響圖示顯示，不碰頭控與眼控邏輯
        const ARASAAC_SEARCH_BASE = 'https://api.arasaac.org/api/pictograms/en/search';
        const ARASAAC_PICTOGRAM_BASE = 'https://api.arasaac.org/api/pictograms';
        const arasaacIconCache = new Map();

        async function getArasaacIconUrl(searchText) {
            const keyword = String(searchText || '').trim().toLowerCase();
            if (!keyword) return null;

            if (arasaacIconCache.has(keyword)) {
                return arasaacIconCache.get(keyword);
            }

            try {
                const response = await fetch(`${ARASAAC_SEARCH_BASE}/${encodeURIComponent(keyword)}`);
                if (!response.ok) throw new Error('ARASAAC search failed');

                const results = await response.json();
                const firstResult = Array.isArray(results) ? results[0] : null;
                const pictogramId = firstResult?._id || firstResult?.id;

                const iconUrl = pictogramId ? `${ARASAAC_PICTOGRAM_BASE}/${pictogramId}?download=false` : null;
                arasaacIconCache.set(keyword, iconUrl);
                return iconUrl;
            } catch (error) {
                console.warn('ARASAAC 圖示載入失敗，改用原本 Material Symbols：', searchText, error);
                arasaacIconCache.set(keyword, null);
                return null;
            }
        }

        function getArasaacSearchKeyword(item) {
            return item[2] || item[0];
        }

                async function replaceWithArasaacIcon(iconHolder, item, sizeClass = 'arasaac-icon') {
            const iconUrl = await getArasaacIconUrl(getArasaacSearchKeyword(item));
            if (!iconUrl || !iconHolder) return;

            const img = new Image();
            img.className = sizeClass;
            img.alt = item[0];

            img.onload = () => {
                if (iconHolder.isConnected) {
                    iconHolder.replaceWith(img);
                }
            };

            img.onerror = () => {
                console.warn('ARASAAC 圖片載入失敗，保留原本 Material Symbols：', item[0]);
            };

            img.src = iconUrl;
        }
        // 當前使用者配置在介面上的九個詞彙 (預設為前九個)
        const menuData = {
            'common': [...FULL_VOCABULARY_DATABASE['common'].slice(0, 9)],

        let SENSITIVITY_X = 6.0;

        // 新增：切換設定選單的開關函式與 UI 數值雙向更新
        function toggleSettingsMenu() {
            const sidebar = document.getElementById('settings-sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            const isOpen = sidebar.classList.contains('translate-x-0');

            if (isOpen) {
                sidebar.classList.replace('translate-x-0', '-translate-x-full');
                overlay.classList.replace('opacity-100', 'opacity-0');
                overlay.classList.add('pointer-events-none');
            } else {
                // 開啟時，將當前運算變數的值回填到畫面的滑桿上
                document.getElementById('input-sensX').value = SENSITIVITY_X;
                document.getElementById('input-sensY').value = SENSITIVITY_Y;
                document.getElementById('input-dwell').value = (DWEL_TIME / 1000).toFixed(1);
                
                document.getElementById('val-sensX').innerText = SENSITIVITY_X.toFixed(1);
                document.getElementById('val-sensY').innerText = SENSITIVITY_Y.toFixed(1);
                document.getElementById('val-dwell').innerText = (DWEL_TIME / 1000).toFixed(1) + ' 秒';

                overlay.classList.replace('opacity-0', 'opacity-100');
                overlay.classList.remove('pointer-events-none');
            }

        function updateSettingsFromUI() {

        // 新增需求相關功能：渲染龐大庫存詞彙以供挑選

                totalAvailable.forEach((item) => {

                    isSelected

                }`;

                    <span class="font-black text-xl tracking-wide">${text}</span>
                `;
                
                const iconHolder = card.querySelector('.material-symbols-outlined.text-4xl');
                replaceWithArasaacIcon(iconHolder, item, 'arasaac-icon-small');
                // 點擊事件：切換選取狀態，並嚴格限制只能選擇 9 個
                card.onclick = () => {
                    const idx = selectedList.indexOf(text);

                        selectedList.splice(idx, 1);

                        // 原本未選取 -> 檢查是否超過 9 個
                        if (selectedList.length >= 9) {
                            alert('每個介面類別限制「只能選擇九個」放置於畫面中！請先取消勾選不需要的詞彙。');
                            return;
                        }
                        selectedList.push(text);
                    }
                    renderVocabSelectionGrid();
                };

                grid.appendChild(card);
            });
        }

        // 新增需求相關功能：儲存並套用選取結果
        function saveVocabularySelection() {
            // 檢查是否每個分類都完整選滿 9 個
            for (let cat in tempSelectedVocab) {
                if (tempSelectedVocab[cat].length !== 9) {
                    const catNameMap = { 'common': '常用', 'eat': '食', 'cloth': '衣', 'live': '住', 'move': '行' };
                    alert(`【${catNameMap[cat]}】分類目前選了 ${tempSelectedVocab[cat].length} 個。請確認每個類別都恰好選滿 9 個詞彙才能存檔套用！`);
                    switchVocabTab(cat);
                    return;
                }
            }

            // 將暫存寫回核心配置中
            for (let cat in tempSelectedVocab) {
                menuData[cat] = tempSelectedVocab[cat].map(text => {
                    // 從完整資料庫撈取原有的 icon 結構
                    return FULL_VOCABULARY_DATABASE[cat].find(item => item[0] === text);
                });
            }

            // 即時重繪主網格介面
            const activeNav = document.querySelector('.nav-btn.bg-gray-500, .nav-btn.bg-orange-500, .nav-btn.bg-blue-500, .nav-btn.bg-green-500, .nav-btn.bg-purple-500');
            let currentActiveCat = 'common';
            if (activeNav) {
                if (activeNav.id === 'nav-eat') currentActiveCat = 'eat';
                if (activeNav.id === 'nav-cloth') currentActiveCat = 'cloth';
                if (activeNav.id === 'nav-live') currentActiveCat = 'live';
                if (activeNav.id === 'nav-move') currentActiveCat = 'move';
            }
            updateGrid(currentActiveCat);
            
            closeVocabularyModal();
            toggleSettingsMenu(); // 順便收合右拉選單
        }

        function toggleLanguage() {
            if (currentLanguage === 'zh-TW') {
                currentLanguage = 'nan-TW';
                document.getElementById('current-lang-text').innerText = '台語(閩南語)';
                document.getElementById('btn-lang-toggle').classList.replace('bg-slate-700', 'bg-orange-600');
            } else {
                currentLanguage = 'zh-TW';
                document.getElementById('current-lang-text').innerText = '中文(國語)';
                document.getElementById('btn-lang-toggle').classList.replace('bg-orange-600', 'bg-slate-700');
            }
        }

        // 切換控制模式 (已改為接收 select 傳入的值)
        function switchControlMode(selectedMode) {
            resetGaze();
            if (selectedMode) {
                currentMode = selectedMode;
            }
            
            if (currentMode === 'head') {
                SENSITIVITY_X = 6.0;
                SENSITIVITY_Y = 6.0;
                startCameraAndAI();
            } else if (currentMode === 'eye') {
                // 眼控放大靈敏度（搭配動態校準演算法）
                SENSITIVITY_X = 35.0;
                SENSITIVITY_Y = 28.0;
                startCameraAndAI();
            } else {
                currentMode = 'touch';
                stopCameraAndAI();
            }
        }

                function updateGrid(category) {
            const container = document.getElementById('grid-container');
            container.innerHTML = '';
            menuData[category].forEach((item, index) => {
                const [text, iconName] = item;
                const btn = document.createElement('div');
                btn.className = 'phrase-btn';
                btn.id = `phrase-btn-${index}`;
                btn.innerHTML = `
                    <div class="gaze-progress"></div>
                    <div class="btn-content">
                        <span class="material-symbols-outlined icon-main">${iconName}</span>
                        <span class="text-main">${text}</span>
                    </div>
                `;
                btn.onclick = () => triggerButtonAction(btn, text);
                container.appendChild(btn);

                const iconHolder = btn.querySelector('.icon-main');
                replaceWithArasaacIcon(iconHolder, item, 'arasaac-icon');
            });
            container.scrollLeft = 0;
        }
        function triggerButtonAction(element, text) {
            const now = Date.now();
            if (now - lastClick < 700) return;
            lastClick = now;
            document.getElementById('output').innerText += text + ' ';
            speakText(text);
            resetGaze();
        }

        "use strict";
        function speakText(text) {
            window.speechSynthesis.cancel();
            const msg = new SpeechSynthesisUtterance(text);

            if (currentLanguage === 'nan-TW') {
                const voices = window.speechSynthesis.getVoices();
                const taiwaneseVoice = voices.find(v =>
                    v.lang.includes('nan') ||
                    v.lang.includes('min') ||
                    v.name.includes('Taiwanese') ||
                    v.name.includes('台語')
                );

                if (taiwaneseVoice) {
                    msg.voice = taiwaneseVoice;
                    msg.lang = taiwaneseVoice.lang;
                } else {
                    msg.lang = 'zh-TW';
                }
            } else {
                msg.lang = 'zh-TW';
            }

            msg.rate = 0.8;
            window.speechSynthesis.speak(msg);
        }

        function playAll() {
            speakText(document.getElementById('output').innerText || "請先點選按鈕");
            resetGaze();
        }

        /* 修正與瀏覽器原生的名詞衝突 */
        function clearDisplay() {
            document.getElementById('output').innerText = '';
            window.speechSynthesis.cancel();
            resetGaze();
        }
        
        function clearAll() {
            clearDisplay();
        }

        function resetGaze() {
            if (currentHoveredElement) {
                const progressEl = currentHoveredElement.querySelector('.gaze-progress');
                if (progressEl) progressEl.style.width = '0%';
            }
            currentHoveredElement = null;
            gazeStartTime = 0;
        }

        // 初始化 MediaPipe Face Mesh
        function initAIModel() {
            faceMesh = new FaceMesh({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
            });

            faceMesh.setOptions({
                maxNumFaces: 1,
                refineLandmarks: true, // 核心：必須精準抓取瞳孔的 5 個特徵點
                minDetectionConfidence: 0.6,
                minTrackingConfidence: 0.6
            });

            const cursorElement = document.getElementById('head-cursor');
            const loadingElement = document.getElementById('loading-status');

            // --- 強化版濾波器核心變數 (卡爾曼簡化版濾波與自適應邊界) ---
            let kalmanX = window.innerWidth / 2;
            let kalmanY = window.innerHeight / 2;
            let P_x = 1.0, P_y = 1.0; 
            const Q = 0.015; // 過程噪聲（越小越平滑，用於鎖定目標不抖動）
            const R = 0.45;  // 量測噪聲（防震顫）

            // 自適應雙眼眼眶範圍邊界（自動校準使用者眼神範圍）
            let minRatioX = 0.42, maxRatioX = 0.58;
            let minRatioY = 0.40, maxRatioY = 0.60;

            faceMesh.onResults((results) => {
                if (currentMode === 'touch') return;

                if (loadingElement.style.display !== 'none') {
                    loadingElement.style.display = 'none';
                    cursorElement.style.display = 'block';
                }

                if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
                    const landmarks = results.multiFaceLandmarks[0];
                    
                    let targetX = 0;
                    let targetY = 0;

                    if (currentMode === 'head') {
                        // 【頭控模式】保持原本穩定的鼻尖追蹤
                        const nose = landmarks[4];
                        targetX = window.innerWidth / 2 + ((1 - nose.x) - 0.5) * window.innerWidth * SENSITIVITY_X;
                        targetY = window.innerHeight / 2 + (nose.y - 0.5) * window.innerHeight * SENSITIVITY_Y;
                        
                        kalmanX = targetX;
                        kalmanY = targetY;
                    } 
                    else if (currentMode === 'eye') {
                        // 【高精準眼控模式】：雙眼特徵融合與自適應校準
                        
                        // 左眼邊界與瞳孔 (33:外眼角, 133:內眼角, 159:上眼瞼, 145:下眼瞼, 468:瞳孔中心)
                        const lLeft = landmarks[33], lRight = landmarks[133];
                        const lTop = landmarks[159], lBottom = landmarks[145];
                        const lPupil = landmarks[468];

                        // 右眼邊界與瞳孔 (362:內眼角, 263:外眼角, 386:上眼瞼, 374:下眼瞼, 473:瞳孔中心)
                        const rLeft = landmarks[362], rRight = landmarks[263];
                        const rTop = landmarks[386], rBottom = landmarks[374];
                        const rPupil = landmarks[473];

                        if (lLeft && lRight && lTop && lBottom && lPupil && rLeft && rRight && rTop && rBottom && rPupil) {
                            
                            // 1. 計算左眼與右眼的水平/垂直相對比例
                            const lWidth = Math.abs(lRight.x - lLeft.x);
                            const lHeight = Math.abs(lBottom.y - lTop.y);
                            const rWidth = Math.abs(rRight.x - rLeft.x);
                            const rHeight = Math.abs(rBottom.y - rTop.y);

                            if (lWidth > 0 && lHeight > 0 && rWidth > 0 && rHeight > 0) {
                                const rxLeft = (lPupil.x - lLeft.x) / lWidth;
                                const ryLeft = (lPupil.y - lTop.y) / lHeight;
                                
                                const rxRight = (rPupil.x - rLeft.x) / rWidth;
                                const ryRight = (rPupil.y - rTop.y) / rHeight;

                                // 2. 雙眼權重融合，降低環境光源不均帶來的單眼跳動
                                const avgRatioX = (rxLeft + rxRight) / 2;
                                const avgRatioY = (ryLeft + ryRight) / 2;

                                // 3. 自適應邊界學習：自動記錄使用者眼球轉動的最大極限
                                if (avgRatioX < minRatioX && avgRatioX > 0.3) minRatioX = avgRatioX;
                                if (avgRatioX > maxRatioX && avgRatioX < 0.7) maxRatioX = avgRatioX;
                                if (avgRatioY < minRatioY && avgRatioY > 0.3) minRatioY = avgRatioY;
                                if (avgRatioY > maxRatioY && avgRatioY < 0.7) maxRatioY = avgRatioY;

                                // 4. 將當前的眼神比例歸一化 (0.0 ~ 1.0)，讓眼球轉動邊緣按鈕更輕鬆
                                const normX = (avgRatioX - minRatioX) / (maxRatioX - minRatioX || 1);
                                const normY = (avgRatioY - minRatioY) / (maxRatioY - minRatioY || 1);

                                // 5. 映射至螢幕座標（考慮鏡頭左右反轉）
                                targetX = window.innerWidth * (1 - normX);
                                targetY = window.innerHeight * normY;

                                // 6. 卡爾曼濾波演算法：動態估算最佳位置，在動態跟隨與靜態鎖定之間取得完美平衡
                                // X 軸濾波
                                P_x = P_x + Q;
                                const K_x = P_x / (P_x + R);
                                kalmanX = kalmanX + K_x * (targetX - kalmanX);
                                P_x = (1 - K_x) * P_x;

                                // Y 軸濾波
                                P_y = P_y + Q;
                                const K_y = P_y / (P_y + R);
                                kalmanY = kalmanY + K_y * (targetY - kalmanY);
                                P_y = (1 - K_y) * P_y;
                            }
                        }
                    }

                    // 限制游標不超出螢幕邊界並更新位置
                    const finalX = Math.max(0, Math.min(window.innerWidth, kalmanX));
                    const finalY = Math.max(0, Math.min(window.innerHeight, kalmanY));

                    cursorElement.style.left = `${finalX}px`;
                    cursorElement.style.top = `${finalY}px`;

                    checkHover(finalX, finalY);
                } else {
                    resetGaze();
                }
            });
        }

        // 啟動鏡頭與偵測
        function startCameraAndAI() {
            if (isCameraRunning) return;

            const videoElement = document.getElementById('webcam-preview');
            const loadingElement = document.getElementById('loading-status');
            videoElement.style.display = 'block'; 
            loadingElement.style.display = 'block';
            loadingElement.innerText = `AI ${currentMode === 'head' ? '頭控' : '眼控'}模式載入中...`;

            if (!faceMesh) {
                initAIModel();
            }

            if (!camera) {
                camera = new Camera(videoElement, {
                    onFrame: async () => {
                        if (currentMode !== 'touch') {
                            await faceMesh.send({ image: videoElement });
                        }
                    },
                    width: 640,
                    height: 480
                });
            }

            camera.start()
                .then(() => { isCameraRunning = true; })
                .catch(err => { showError(); });
        }

        // 停止鏡頭與偵測（回到觸控模式）
        function stopCameraAndAI() {
            const videoElement = document.getElementById('webcam-preview');
            const cursorElement = document.getElementById('head-cursor');
            const loadingElement = document.getElementById('loading-status');
            
            videoElement.style.display = 'none';
            cursorElement.style.display = 'none';
            loadingElement.style.display = 'none';

            if (videoElement.srcObject) {
                videoElement.srcObject.getTracks().forEach(track => track.stop());
                videoElement.srcObject = null;
            }
            isCameraRunning = false;
        }

        function checkHover(x, y) {
            const gridContainer = document.getElementById('grid-container');
            const leftBoundary = window.innerWidth * 0.10;
            const rightBoundary = window.innerWidth * 0.90;

            if (y > 75 && y < (window.innerHeight - 145)) {
                if (x < leftBoundary) {
                    gridContainer.scrollLeft -= 12;
                } else if (x > rightBoundary) {
                    gridContainer.scrollLeft += 12;
                }
            }

            const targetEl = document.elementFromPoint(x, y);
            const clickableBtn = targetEl?.closest('.phrase-btn, .nav-btn, .ctrl-btn');

            if (clickableBtn) {
                if (currentHoveredElement === clickableBtn) {
                    const duration = Date.now() - gazeStartTime;
                    const progress = Math.min((duration / DWEL_TIME) * 100, 100);

                    const progressEl = clickableBtn.querySelector('.gaze-progress');
                    if (progressEl) progressEl.style.width = `${progress}%`;

                    if (duration >= DWEL_TIME) {
                        clickableBtn.click();
                    }
                } else {
                    resetGaze();
                    currentHoveredElement = clickableBtn;
                    gazeStartTime = Date.now();
                }
            } else {
                resetGaze();
            }
        }

        function showError() {
            document.getElementById('loading-status').innerHTML = `
                <div class="text-red-400 font-bold mb-2">鏡頭啟動失敗</div>
                <div class="text-sm text-gray-300 text-left">
                    1. 由於安全性限制，本地檔案 (file://) 無法開啟鏡頭。<br>
                    2. 請先將檔案部署到 <span class="text-yellow-300">GitHub Pages</span>（HTTPS環境）再開啟。<br>
                    3. 開啟網頁後，請務必點擊瀏覽器的「允許」鏡頭權限。
                </div>
            `;
            document.getElementById('loading-status').style.display = 'block';
        }

        window.onload = () => {
            updateGrid('common');
            if (window.speechSynthesis.onvoiceschanged !== undefined) {
                window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
            }
        };
    </script>
